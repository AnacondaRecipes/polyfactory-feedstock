{% set name = "polyfactory" %}
{% set version = "3.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 78a1e4cf8f317be7da7c111d661f39db35080ec9c12b8df7c01dfbbc1c17250f

build:
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0
  skip: true  # [py<39 or s390x]

requirements:
  host:
    - python 
    - hatchling
    - pip
  run:
    - python
    - faker >=5.0.0
    - typing-extensions >=4.6.0
  # run_constrained translates every bounded [project.optional-dependencies] extra from
  # upstream pyproject.toml (sqlalchemy, pydantic, msgspec, odmantic, beanie->pymongo,
  # attrs); beanie and full extras are unversioned upstream, so they are no-ops here.
  run_constrained:
    - sqlalchemy >=1.4.29
    - attrs >=22.2.0
    - odmantic <1.0.0
    - msgspec >=0.20.0
    - pymongo <4.9
    - eval-type-backport >=0.2.2
    - pydantic >=1.10

{% set tests_to_skip = "" %}
# OSError: Invalid argument calling dt.datetime.fromtimestamp(timestamp, tzinfo) on windows
{% set tests_to_skip = tests_to_skip + " test_handle_constrained_date[ge-le]" %}
{% set tests_to_skip = tests_to_skip + " or test_handle_constrained_date[gt-lt]" %}
{% set tests_to_skip = tests_to_skip + " or test_handle_constrained_date[ge-lt]" %}
{% set tests_to_skip = tests_to_skip + " or test_handle_constrained_date[gt-le]" %}

{% set tests_to_ignore = "" %}
# we do not provide beanie on main
{% set tests_to_ignore = tests_to_ignore + " --ignore=tests/test_beanie_factory.py" %}
# we do not provide odmantic on main
{% set tests_to_ignore = tests_to_ignore + " --ignore=tests/test_odmantic_factory.py" %}

test:
  source_files:
    - tests
    # upstream's [tool.pytest.ini_options] sets asyncio_mode=auto; without it the
    # async sqlalchemy tests ERROR at setup ("async fixture with no plugin")
    - pyproject.toml
  imports:
    - polyfactory
  commands:
    - pip check
    - pytest -v tests {{ tests_to_ignore }} -k "not ({{ tests_to_skip }})"
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - sqlalchemy
    - hypothesis
    - pydantic
    - aiosqlite
    - annotated-types
    - msgspec
    - attrs
    - email-validator

about:
  home: https://github.com/litestar-org/polyfactory
  summary: Mock data generation factories
  license: MIT
  license_file: LICENSE
  license_family: MIT
  description: |
    Polyfactory is a simple and powerful mock data generation library, based around type 
    hints and supporting dataclasses, typed-dicts, pydantic models, msgspec structs and more.
  dev_url: https://github.com/litestar-org/polyfactory
  doc_url: https://polyfactory.litestar.dev/
extra:
  recipe-maintainers:
    - ivergara
